{% extends 'base.html' %}
{% block content %}

<style>
  .dashboard-bg {
    position: relative;
    background-image: url('{{ url_for('static', filename='images/bg.jpg') }}');
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
    min-height: 100vh;
    padding: 30px;
    z-index: 1;
  }

  .dashboard-bg::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: rgba(255, 255, 255, 0.6); /* translucent white overlay */
    z-index: -1;
  }

  .content {
    position: relative;
    z-index: 2;
  }
</style>

<div class="dashboard-bg">
  <div class="content">
    <h2>📊 Dashboard</h2>
    <p>Welcome, {{ user.name }}! 🎉</p>
    <div class="row">
      <div class="col-md-4"><div class="card p-3">📏 BMI: {{ bmi|round(2) }}</div></div>
      <div class="col-md-4"><div class="card p-3">🔥 Daily Calories: {{ daily_calories|round(0) }}</div></div>
      <div class="col-md-4"><div class="card p-3">💧 Water Today: {{ today_water }} L</div></div>
    </div>
    <div class="row mt-3">
      <div class="col-md-4"><div class="card p-3">💪 Exercise Today: {{ today_exercise }} min</div></div>
      <div class="col-md-4"><div class="card p-3">😴 Sleep Today: {{ today_sleep }} hrs</div></div>
    </div>
  </div>
</div>

{% endblock %}
